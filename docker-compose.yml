name: gtochess

services:
  api:
    build:
      context: ./backend
      target: dev
      args:
        ENGINE_PLATFORM: linux-x86-64
    # The engine assets are AVX2 x86-64 builds; pin the platform so an Apple
    # Silicon host emulates rather than failing at engine start.
    platform: linux/amd64
    ports:
      # Host 8000 is commonly taken; override with GTOCHESS_API_PORT.
      - "${GTOCHESS_API_PORT:-8010}:8000"
    environment:
      GTOCHESS_ENGINE_PATH: /opt/stockfish/stockfish
      GTOCHESS_REDIS_URL: redis://redis:6379/0
      GTOCHESS_DATA_DIR: /data
      # Unset falls back to the deterministic provider, so the API still answers.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Live reload for source only. /opt/venv and /opt/stockfish stay image-owned
      # so a bind mount can never shadow the verified engine.
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: dev
      args:
        ENGINE_PLATFORM: linux-x86-64
    platform: linux/amd64
    command:
      ["celery", "-A", "gtochess.jobs.app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      GTOCHESS_ENGINE_PATH: /opt/stockfish/stockfish
      GTOCHESS_REDIS_URL: redis://redis:6379/0
      GTOCHESS_DATA_DIR: /data
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
