name: Terraform

# Manual only, and deliberately so. Nothing here should ever fire off a push:
# the stack owns a database ceiling, a Cognito pool and a spot fleet, and none of
# those should move because someone edited a component.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        default: plan
        options: [plan, apply, destroy]
      stack:
        description: Which stack. lite is the one that is live.
        type: choice
        default: lite
        options: [lite, ecs]

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: infra/${{ inputs.stack == 'ecs' && 'terraform' || 'lite' }}
    shell: bash

jobs:
  terraform:
    runs-on: ubuntu-latest
    # apply and destroy stop here for approval when the environment carries a
    # protection rule. plan needs no gate, so it runs against a bare environment.
    environment: ${{ inputs.action == 'plan' && 'terraform-plan' || 'terraform-apply' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Falls back so a single role setup still works.
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          # 1.10 or later: locking without a DynamoDB table needs use_lockfile.
          terraform_version: ${{ secrets.TERRAFORM_VERSION || '1.10.5' }}
          terraform_wrapper: false

      # Written here rather than committed so a local `terraform init` still gets
      # local state and never reaches for a bucket that may not exist.
      - name: Point state at S3
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            if [ "${{ inputs.action }}" != "plan" ]; then
              echo "TF_STATE_BUCKET is unset, so state would be local to this runner and" >&2
              echo "discarded with it. An apply would orphan what it built and a destroy" >&2
              echo "would report success while the stack kept running. Refusing." >&2
              exit 1
            fi
            echo "TF_STATE_BUCKET unset. Planning against empty local state; this plan means nothing."
            exit 0
          fi
          cat > backend.tf <<'EOT'
          terraform {
            backend "s3" {}
          }
          EOT

      - name: Init
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          KEY: ${{ secrets.TF_STATE_KEY || format('gtochess/{0}/terraform.tfstate', inputs.stack) }}
          REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            terraform init -input=false
            exit 0
          fi
          args=(-input=false -backend-config="bucket=$BUCKET" -backend-config="key=$KEY" -backend-config="region=$REGION")
          if [ -n "$LOCK_TABLE" ]; then
            args+=(-backend-config="dynamodb_table=$LOCK_TABLE")
          else
            args+=(-backend-config="use_lockfile=true")
          fi
          terraform init "${args[@]}"

      - name: Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate

      # Everything else is committed in terraform.tfvars, which holds a domain,
      # a zone id and a handful of switches, none of them secret. Only the ones
      # that genuinely differ per environment come from here.
      - name: Collect variables
        env:
          DOMAIN_NAME: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ secrets.TF_VAR_HOSTED_ZONE_ID }}
          ACME_EMAIL: ${{ secrets.TF_VAR_ACME_EMAIL }}
        run: |
          set -euo pipefail
          : > ci.auto.tfvars
          quoted() { if [ -n "$2" ]; then echo "$1 = \"$2\"" >> ci.auto.tfvars; fi; }

          quoted domain_name "$DOMAIN_NAME"
          quoted hosted_zone_id "$HOSTED_ZONE_ID"
          quoted acme_email "$ACME_EMAIL"

          echo "--- ci.auto.tfvars ---"
          cat ci.auto.tfvars

      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Plan a destroy
        if: inputs.action == 'destroy'
        run: terraform plan -input=false -lock-timeout=5m -destroy -out=tfplan

      - name: Summarise the plan
        run: |
          {
            echo '### terraform ${{ inputs.action }} on ${{ inputs.stack }}'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.action != 'plan'
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: |
          {
            echo '### Stack'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
