name: Deploy

# Manual only. Landing on main is not a decision to ship, and the deploy role is
# trusted only from refs/heads/main, so run this from the default branch.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build and roll out
        type: choice
        default: both
        options: [both, web, backend]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  STACK: ${{ secrets.STACK_NAME || 'gtochess-lite' }}

jobs:
  # Static, so there is no image and no container. Vite content hashes every
  # asset, which is what lets the two syncs below carry different cache headers.
  web:
    if: inputs.target == 'both' || inputs.target == 'web'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish the site
        run: |
          set -euo pipefail
          # Hashed assets first and kept for a year, so a browser never asks for
          # them twice. index.html last and never cached, because it is the file
          # that names the new hashes.
          aws s3 sync dist "s3://${STACK}-site" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${STACK}-site/index.html" \
            --cache-control "no-cache"

  backend:
    if: inputs.target == 'both' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.STACK }}-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.STACK }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # One instance runs the whole application, so a rollout is telling it to pull.
  # The script it runs lives on the box and was written when it was built.
  rollout:
    needs: [web, backend]
    # Runs when either half succeeded and neither failed, since a web-only or
    # backend-only dispatch skips the other job rather than failing it.
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pull and restart
        run: |
          set -euo pipefail
          instance="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${STACK}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          if [ -z "$instance" ] || [ "$instance" = "None" ]; then
            echo "no running instance tagged ${STACK}" >&2
            exit 1
          fi
          echo "rolling $instance"

          command="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$instance" \
            --parameters 'commands=["/usr/local/bin/gtochess-redeploy"]' \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)"

          # send-command returns as soon as it is queued, so the run is only
          # green once the box says the script finished.
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command" --instance-id "$instance" \
              --query 'Status' --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) echo "redeployed"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command" \
                  --instance-id "$instance" --query 'StandardErrorContent' --output text
                echo "redeploy $status" >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "redeploy did not finish in ten minutes" >&2
          exit 1
