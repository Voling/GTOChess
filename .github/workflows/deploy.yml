name: Deploy

# Manual only. Landing on main is not a decision to ship, and the deploy role is
# trusted only from refs/heads/main, so run this from the default branch.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build and roll out
        type: choice
        default: both
        options: [both, web, backend]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Static, so there is no image and no container. Vite content hashes every
  # asset, which is what lets the two syncs below carry different cache headers.
  web:
    if: inputs.target == 'both' || inputs.target == 'web'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Publish the site
        env:
          BUCKET: ${{ secrets.SITE_BUCKET || 'gtochess-prod-site' }}
        run: |
          set -euo pipefail
          # Hashed assets first and kept for a year, so the edge never asks for
          # them twice. index.html last and never cached, because it is the file
          # that names the new hashes.
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

  backend:
    if: inputs.target == 'both' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_BACKEND || 'gtochess-prod-backend' }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_BACKEND || 'gtochess-prod-backend' }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # The task definitions name :latest, which the backend job just moved, so a
  # forced deployment is the whole rollout. Terraform is not in this path, and
  # the frontend is not either: it is already live once its objects land.
  rollout:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Force a new deployment on what changed
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER || 'gtochess-prod' }}
          SERVICE_API: ${{ secrets.ECS_SERVICE_API || 'gtochess-prod-api' }}
          SERVICE_WORKER: ${{ secrets.ECS_SERVICE_WORKER || 'gtochess-prod-worker' }}
        run: |
          set -euo pipefail
          services="$SERVICE_API $SERVICE_WORKER"
          for service in $services; do
            echo "rolling $service"
            aws ecs update-service --cluster "$CLUSTER" --service "$service" --force-new-deployment > /dev/null
          done
          for service in $services; do
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$service"
            echo "$service stable"
          done

  # Only index.html and the SPA fallback need forgetting. The hashed assets are
  # immutable by name, so a new build never collides with a cached old one.
  invalidate:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DISTRIBUTION" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID unset, nothing to invalidate"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths "/" "/index.html" > /dev/null
