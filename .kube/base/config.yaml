apiVersion: v1
kind: ConfigMap
metadata:
  name: gtochess-config
data:
  GTOCHESS_ENGINE_PATH: /opt/stockfish/stockfish
  GTOCHESS_DATA_DIR: /data
  GTOCHESS_PIPELINE_VERSION: v1
  GTOCHESS_LLM_PROVIDER: auto
  GTOCHESS_LLM_MODEL: claude-opus-5
  GTOCHESS_LLM_EFFORT: medium
  GTOCHESS_DATABASE_URL: postgresql+psycopg://gtochess:gtochess@gtochess-postgres:5432/gtochess
  GTOCHESS_REDIS_URL: redis://gtochess-redis:6379/0
