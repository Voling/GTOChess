apiVersion: v1
kind: ConfigMap
metadata:
  name: fiftymoves-config
data:
  FIFTYMOVES_ENGINE_PATH: /opt/stockfish/stockfish
  FIFTYMOVES_DATA_DIR: /data
  FIFTYMOVES_PIPELINE_VERSION: v1
  FIFTYMOVES_LLM_PROVIDER: auto
  FIFTYMOVES_LLM_MODEL: claude-opus-5
  FIFTYMOVES_LLM_EFFORT: medium
  FIFTYMOVES_DATABASE_URL: postgresql+psycopg://fiftymoves:fiftymoves@fiftymoves-postgres:5432/fiftymoves
  FIFTYMOVES_REDIS_URL: redis://fiftymoves-redis:6379/0
