apiVersion: v1
kind: Service
metadata:
  name: fiftymoves-postgres
spec:
  selector:
    app.kubernetes.io/name: fiftymoves
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiftymoves-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fiftymoves
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiftymoves
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: fiftymoves
            - name: POSTGRES_PASSWORD
              value: fiftymoves
            - name: POSTGRES_DB
              value: fiftymoves
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fiftymoves", "-d", "fiftymoves"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: fiftymoves-pgdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fiftymoves-pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fiftymoves-redis
spec:
  selector:
    app.kubernetes.io/name: fiftymoves
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiftymoves-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fiftymoves
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiftymoves
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 10
