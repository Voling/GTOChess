apiVersion: v1
kind: Service
metadata:
  name: gtochess-web
  labels:
    app.kubernetes.io/name: gtochess
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: gtochess
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtochess-web
  labels:
    app.kubernetes.io/name: gtochess
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gtochess
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtochess
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: gtochess-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://gtochess-api:8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
